name: Verify application
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: cargo test --locked
      - run: npm run build
      - run: cargo build --release --locked --bin api
      - run: npx playwright install --with-deps chromium
      - name: Start local Rust server and test browser
        shell: bash
        run: |
          cargo build --locked --bin archimede
          ./target/debug/archimede > /tmp/archimede.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8787/api/v2?action=catalog' > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
          npm run test:rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
      - name: Check Vercel Analytics production integration
        run: |
          VERCEL=1 npm run build
          npm run test:analytics
      - name: Check Rust serverless entrypoint
        run: |
          VERCEL_DEV_PORT=8790 ./target/release/api > /tmp/archimede-api.log 2>&1 &
          npm run test:runtime
