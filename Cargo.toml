[package]
name = "archimede"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
vercel_runtime = { version = "2", features = ["axum"] }
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "api"
path = "api/index.rs"

[[bin]]
name = "archimede"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
